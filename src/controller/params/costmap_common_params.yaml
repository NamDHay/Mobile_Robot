obstacle_range: 5.0 # 2.0
raytrace_range: 5.0 # 3.0

transform_tolerance: 0.2 # 0.0

footprint: [[-0.2, -0.15], [0.2, -0.15], [0.2, 0.15], [-0.2, 0.15]]  # 30 cm x 40 cm rectangle
footprint_padding: 0.05  # 5 cm padding
inflation_radius: 0.3 # 0.0
cost_scaling_factor: 10.0

transform_tolerance: 1

controller_frequency: 10.0
planner_patience: 5.0
controller_patience: 15.0

observation_sources: laser_scan_sensor point_cloud_sensor

laser_scan_sensor: {sensor_frame: laser, data_type: LaserScan, topic: /filtered_scan, marking: true, clearing: true}
point_cloud_sensor: {sensor_frame: camera_depth_optical_frame, data_type: PointCloud2, topic: camera/depth_registered/points, marking: true, clearing: true, min_obstacle_height: 0.05, max_obstacle_height: 1.0}

base_global_planner: "navfn/NavfnROS"
base_local_planner: "base_local_planner/TrajectoryPlannerROS"

NavfnROS:
    allow_unknown: true
    default_tolerance: 0.1

recovery_behaviors: [
    {name: conservative_clear, type: clear_costmap_recovery/ClearCostmapRecovery},
    {name: aggressive_clear, type: clear_costmap_recovery/ClearCostmapRecovery}
]

conservative_clear: 
    reset_distance: 3.00
aggressive_clear:
    reset_distance: 1.84
